[package]
name = "archgate-connect"
version = "0.1.0"
description = "ArchGate Connect tray — operator bastion client"
authors = ["IntegrAllTech"]
edition = "2021"

[lib]
name = "archgate_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
