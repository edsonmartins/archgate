# Template — peer WireGuard institucional (produção)
# Lado: connector na rede ArchGate (ou VM connector no site)
#
# NÃO commitar chaves reais. Gerar com:
#   wg genkey | tee privatekey | wg pubkey > publickey
#
# Integração:
#   1. Subir interface wg no connector (network_mode host ou privileged)
#   2. AllowedIPs = subnets do cliente onde estão os targets
#   3. Warpgate target host = IP do alvo via tunnel (ou localhost forward no connector)
#   4. Ficha site: conectividade.tipo = connector_peer

[Interface]
# Address = 10.200.0.2/32
# PrivateKey = <CONNECTOR_PRIVATE_KEY>
# ListenPort = 51820   # se o cliente inicia o peer para nós

[Peer]
# PublicKey = <CLIENT_SITE_PUBLIC_KEY>
# Endpoint = vpn.cliente.example:51820
# AllowedIPs = 10.50.0.0/24, 10.51.0.0/24
# PersistentKeepalive = 25
