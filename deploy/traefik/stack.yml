# ArchGate — Traefik edge (Fase 1, tarefa 1.2)
# Traefik v3: providers.swarm + file (serversTransport for Kanidm HTTPS).
# TLS: Let's Encrypt HTTP-01 when DNS reaches this host; Cloudflare Tunnel alternative.

version: "3.8"

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.4.1}
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=archgate-public
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - /root/archgate/repo/deploy/traefik/dynamic:/dynamic:ro
    networks:
      - archgate-public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.archgate.edge == true
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      labels:
        - traefik.enable=false

networks:
  archgate-public:
    external: true
    name: archgate-public

volumes:
  traefik_letsencrypt:
    driver: local
