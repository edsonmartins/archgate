# SOPS config for ArchGate bootstrap secrets.
# Age public keys only (private keys NEVER in git).
#
# Setup:
#   age-keygen -o ~/.config/archgate/age-key.txt
#   # put public key below under age: list
#   sops --encrypt deploy/env.example/bootstrap.env > deploy/secrets/bootstrap.enc.env
#
# Decrypt (local, offline of platform):
#   export SOPS_AGE_KEY_FILE=~/.config/archgate/age-key.txt
#   sops -d deploy/secrets/bootstrap.enc.env > /tmp/archgate-bootstrap.env

creation_rules:
  - path_regex: .*\.enc\.env$
    encrypted_regex: ^(.*)$
    age:
      # Public key from /root/archgate/age-key.txt on 192.168.1.180 (private key stays on host)
      - age1wwqfcw44xchtv9vnx07qcec8x9d5ch88nmakmfpla4m8dm0asags4njfuw
  - path_regex: .*\.enc\.yaml$
    age:
      - age1wwqfcw44xchtv9vnx07qcec8x9d5ch88nmakmfpla4m8dm0asags4njfuw
