server:
  port: ${ORCH_PORT:8090}

spring:
  application:
    name: archgate-orchestration
  autoconfigure:
    exclude: ${ORCH_AUTOCONFIG_EXCLUDE:org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

management:
  endpoints:
    web:
      exposure:
        include: health,info

archgate:
  orchestration:
    # mock = in-memory (tests/lab); live = HTTP adapters (dry-run default)
    mode: ${ORCH_MODE:mock}
    dry-run: ${ORCH_DRY_RUN:true}
    # Service token required on every route. No default on purpose: unset =
    # the API answers 503 instead of running open (audit 2026-07-28, P0-3).
    api-token: ${ORCH_API_TOKEN:}
    # HMAC-SHA256 secret for Axis webhook bodies. Unset = webhooks refused.
    webhook-secret: ${ORCH_WEBHOOK_SECRET:}
    webhook-replay-protection: ${ORCH_WEBHOOK_REPLAY_PROTECTION:false}
    webhook-timestamp-tolerance-seconds: ${ORCH_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
    archguard:
      enabled: ${ORCH_ARCHGUARD_ENABLED:false}
      base-url: ${ORCH_ARCHGUARD_URL:https://app.archguard.com.br}
      token: ${ORCH_ARCHGUARD_TOKEN:}
    warpgate:
      enabled: ${ORCH_WG_ENABLED:false}
      base-url: ${ORCH_WG_URL:https://wg.archgate.com.br}
      token: ${ORCH_WG_TOKEN:}
    guacamole:
      enabled: ${ORCH_GUAC_ENABLED:false}
      base-url: ${ORCH_GUAC_URL:https://guac.archgate.com.br}
      token: ${ORCH_GUAC_TOKEN:}
    openbao:
      enabled: ${ORCH_OPENBAO_ENABLED:false}
      base-url: ${ORCH_OPENBAO_URL:https://secrets.archgate.com.br}
      token: ${ORCH_OPENBAO_TOKEN:}
