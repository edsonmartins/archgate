server:
  port: ${ORCH_PORT:8090}

spring:
  application:
    name: archgate-orchestration

management:
  endpoints:
    web:
      exposure:
        include: health,info

archgate:
  orchestration:
    # mock = in-memory (tests/lab); live = HTTP adapters (dry-run default)
    mode: ${ORCH_MODE:mock}
    dry-run: ${ORCH_DRY_RUN:true}
    kanidm:
      enabled: ${ORCH_KANIDM_ENABLED:false}
      base-url: ${ORCH_KANIDM_URL:https://id.archgate.com.br}
      token: ${ORCH_KANIDM_TOKEN:}
    warpgate:
      enabled: ${ORCH_WG_ENABLED:false}
      base-url: ${ORCH_WG_URL:https://wg.archgate.com.br}
      token: ${ORCH_WG_TOKEN:}
    guacamole:
      enabled: ${ORCH_GUAC_ENABLED:false}
      base-url: ${ORCH_GUAC_URL:https://guac.archgate.com.br}
      token: ${ORCH_GUAC_TOKEN:}
    openbao:
      enabled: ${ORCH_OPENBAO_ENABLED:false}
      base-url: ${ORCH_OPENBAO_URL:https://secrets.archgate.com.br}
      token: ${ORCH_OPENBAO_TOKEN:}
