# Org Credential Broker — inventário exemplo (OCB-0 + OCB-4)
# Importação via UI/API quando disponível; até lá use o seed do Manager.
# NUNCA coloque passwords neste arquivo (git).
#
# federation_status: password_only | oidc_primary | oidc_only | api_key_primary | external_idp
# Ver: org-product-oidc-federation.md

accounts:
  - slug: apple-appstore-integrall
    name: App Store Connect · IntegrAllTech
    category: store
    criticality: P0
    url: https://appstoreconnect.apple.com
    auth_kind: api_key
    federation_status: api_key_primary
    owner_group: archguard_super_admins
    secret_ref: secret/data/org/store/apple-appstore
    requires_dual_control: true
    notes: Usuários individuais + App Store Connect API key no OpenBao.

  - slug: google-play-integrall
    name: Google Play Console · IntegrAllTech
    category: store
    criticality: P0
    url: https://play.google.com/console
    auth_kind: api_key
    federation_status: external_idp
    owner_group: archguard_super_admins
    secret_ref: secret/data/org/store/google-play
    notes: Google IAM individual; SA/API no OpenBao.

  - slug: gcp-integrall-placeholder
    name: Google Cloud · (preencher projeto)
    category: cloud
    criticality: P0
    url: https://console.cloud.google.com
    auth_kind: oidc
    federation_status: external_idp
    owner_group: archguard_super_admins
    secret_ref: secret/data/org/cloud/gcp-placeholder
    notes: Workspace SSO + SA keys no OpenBao.

