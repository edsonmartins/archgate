cliente: Grupo Marra
slug: grupo_marra
tenant_group: tenant_grupo_marra
ambiente: producao
warpgate_roles:
  - tenant-grupo-marra

conectividade:
  tipo: a_confirmar            # connector_peer | tunnel_agent
  stack: a_confirmar           # openvpn | wireguard | openfortivpn | mixed
  wireguard:
    endpoint: ""
    allowed_ips: []
    platform_pubkey_ref: ""
  openvpn:
    profile_ref: ""
    conta_servico: ""
    mfa: false
  openfortivpn:
    host: ""
    port: 443
    conta_servico: ""
    mfa_otp: a_confirmar
  cloudflare_tunnel:
    tunnel_name: ""
    notas: ""
  subnets_alvo: []
  connector_id: connector-grupo-marra
  ip_saida_visto_pelo_cliente: ""
  contato_ops_cliente: ""
  janela_peer: ""
  notas: >
    Tenant já modelado no lab Kanidm (isolação uat-op-b). Confirmar VPN
    com o time (OpenVPN / WG / Forti) e conta de serviço institucional.

targets: []
  # Preencher hosts reais (IPs só no connector, não no notebook do ops)

identidade:
  operadores: []
  tenant_admins: []
  uat_lab:
    - uat-op-b                 # tenant_grupo_marra

estado:
  inventariado: false
  connector_deployed: false
  smoke_operador: false
  data_revisao: "2026-07-17"
  w2_site_status: pending_stack   # pending_stack | in_progress | done

credenciais_alvo: warpgate_and_guacamole_only
anti_padrao: never_document_direct_ip_or_target_password_to_operators
