# Ficha — Rio Quality PRODUÇÃO (conectividade real a confirmar)
# Lab (enquanto peer não existe): ../lab-rio-quality.yaml
# W0-B: documentos/runbooks/W0-EXECUCAO.md · onboarding: deploy/connector/onboarding-cliente-peer.md
#
# Preenchimento: marcar campos; NÃO commitar senhas — só secret_ref / OpenBao path.

cliente: Rio Quality
slug: rio_quality
tenant_group: tenant_rio_quality
ambiente: producao
warpgate_roles:
  - tenant-rio-quality

conectividade:
  tipo: a_confirmar            # connector_peer | tunnel_agent | cloudflare_tunnel | misto
  stack: a_confirmar           # wireguard | openvpn | openfortivpn | cloudflare_tunnel
  cloudflare_tunnel:
    tunnel_name: a_confirmar   # Tunnel existente (Rio)? validar escopo HTTP vs SSH/DB
    notas: >
      Validar se Tunnel cobre só borda HTTP ou também path a hosts SSH/DB.
      Se houver VPN legada em paralelo, registrar stack mista.
  wireguard:
    endpoint: ""               # host:port do peer no cliente
    allowed_ips: []            # subnets dos targets
    platform_pubkey_ref: ""    # path OpenBao ou arquivo no connector (não inline)
  openvpn:
    profile_ref: ""            # secret_ref / path no connector
    conta_servico: ""
    mfa: false
  openfortivpn:
    host: ""
    port: 443
    conta_servico: ""
    mfa_otp: a_confirmar
  subnets_alvo: []             # ex.: ["10.x.y.0/24"]
  connector_id: connector-rio-quality
  ip_saida_visto_pelo_cliente: ""
  contato_ops_cliente: ""      # e-mail/telefone — preencher na janela W0-B01
  janela_peer: ""              # data/hora acordada
  notas: >
    Oracle/Consinco no roadmap (ADR-001). Confirmar stack VPN com ops
    e atualizar clientes-reais-por-stack.md.
    Lab SoT atual: stack=lab_overlay inventariado=true — NÃO confundir com peer real.

targets: []
  # Após inventário real, exemplo (IPs internos — operador NÃO usa estes IPs):
  # - nome: rio-app-ssh
  #   engine: warpgate
  #   protocolo: ssh
  #   host: 10.x.y.z          # visto pelo connector, não pelo notebook
  #   port: 22
  #   roles: [tenant-rio-quality]
  # - nome: rio-app-postgres
  #   engine: warpgate
  #   protocolo: postgres
  #   host: 10.x.y.w
  #   port: 5432
  #   database: ...
  #   roles: [tenant-rio-quality]

identidade:
  operadores: []               # preferir uat-op-a em lab; prod = SPNs reais
  tenant_admins: []
  uat_lab:
    - uat-op-a                 # tenant_rio_quality (Kanidm + WG)

estado:
  inventariado: false          # true só com hosts/stack reais preenchidos
  connector_deployed: false
  smoke_operador: false
  data_revisao: "2026-07-17"
  w0_peer_status: pending_client   # pending_client | in_progress | done

credenciais_alvo: warpgate_and_guacamole_only
anti_padrao: never_document_direct_ip_or_target_password_to_operators
