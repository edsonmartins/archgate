cliente: Rio Quality
slug: rio_quality
tenant_group: tenant_rio_quality
ambiente: producao
warpgate_roles:
  - tenant-rio-quality

conectividade:
  tipo: tunnel_agent
  stack: mixed
  connector_id: rio-forti
  subnets_alvo: [] # A1.1
  ip_saida_visto_pelo_cliente: "217.196.60.108"
  contato_ops_cliente: "" # A1.1
  janela_peer: "" # A1.1
  notas: >
    Dual tunnel_agent: Forti (LAN/Oracle) + OpenVPN (AWS).
    Lab: stack lab_overlay separado (não confundir com peer real).

connectors:
  - id: rio-forti
    stack: openfortivpn
    tipo: tunnel_agent
    subnets: [] # A1.1
    meta:
      forti_host: "" # A1.1
      host_path: /var/lib/archgate/connector/rio-forti
    notas: LAN — Oracle, Consinco, gestor-rq, Linux
  - id: rio-aws
    stack: openvpn
    tipo: tunnel_agent
    subnets: [] # A1.1
    meta:
      ovpn_path: /var/lib/archgate/connector/rio-aws/openvpn/client.ovpn
      host_path: /var/lib/archgate/connector/rio-aws
    notas: AWS — 3 APIs, DBs, observabilidade

targets: []
  # Após A1.1 — exemplos (IPs internos só no SoT admin, não para o dev):
  # - nome: rio-api-1
  #   engine: warpgate
  #   protocolo: ssh
  #   host: 10.x.x.x
  #   port: 22
  #   roles: [tenant-rio-quality]
  #   connector_id: rio-aws
  #   secret_ref: secret/data/archgate/targets/rio-api-1

identidade:
  operadores: [] # A1.1 + Kanidm
  tenant_admins: []
  uat_lab:
    - uat-op-a

estado:
  inventariado: false
  connector_deployed: false
  smoke_operador: false
  data_revisao: "2026-07-18"
  w0_peer_status: pending_client # pending_client | in_progress | done
  sprint: "1-homolog-A"

credenciais_alvo: warpgate_and_openbao_only
anti_padrao: never_document_direct_ip_or_target_password_to_operators
