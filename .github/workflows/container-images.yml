name: Container images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'services/orchestration/**'
      - 'services/oracle-proxy/**'
      - '.github/workflows/container-images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/orchestration/**'
      - 'services/oracle-proxy/**'
      - '.github/workflows/container-images.yml'
  workflow_dispatch:
    inputs:
      build_rustguac_spike:
        description: Build and publish the pinned RustGuac evaluation image
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  archgate-services:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orchestration
            context: services/orchestration
          - name: oracle-proxy
            context: services/oracle-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/archgate-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

  rustguac-spike:
    name: RustGuac pinned evaluation image
    if: github.event_name == 'workflow_dispatch' && inputs.build_rustguac_spike
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited RustGuac revision
        uses: actions/checkout@v4
        with:
          repository: sol1/rustguac
          ref: a897fcc63b672907f01c74515b92ff766530f318

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish audited spike
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/archgate-rustguac-spike:a897fcc63b67
          labels: |
            org.opencontainers.image.source=https://github.com/sol1/rustguac
            org.opencontainers.image.revision=a897fcc63b672907f01c74515b92ff766530f318
            org.opencontainers.image.licenses=Apache-2.0
            br.com.archgate.lifecycle=evaluation-only
          cache-from: type=gha,scope=rustguac-a897fcc63b67
          cache-to: type=gha,mode=max,scope=rustguac-a897fcc63b67
          provenance: mode=max
          sbom: true
