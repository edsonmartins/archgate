name: CI

# Nothing in this monorepo was built or tested automatically until the
# 2026-07-28 audit (P1-5): the three Java services, the Go plugin and the
# ArchGate Connect client only ever compiled on a developer's machine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  java:
    name: Java services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orchestration, agent-control, oracle-proxy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: mvn -B --no-transfer-progress test

      - name: Package
        working-directory: services/${{ matrix.service }}
        run: mvn -B --no-transfer-progress -DskipTests package

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports
          if-no-files-found: ignore

  go:
    name: Go (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: archgate-connect
            dir: clients/archgate-connect
          - name: openbao-oracle-plugin
            dir: services/openbao-oracle-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.dir }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: go test ./...

  unified-ui:
    name: UnifiedUI typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/unified-ui/package-lock.json

      - name: Install
        working-directory: frontend/unified-ui
        run: npm ci

      - name: Type check
        working-directory: frontend/unified-ui
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend/unified-ui
        run: npx vite build

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Deploy and validation scripts are the operational surface of the
      # product; a syntax error there only shows up on the VPS.
      - name: Syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(find deploy clients -name '*.sh' -type f)
          exit $fail

      - name: Shellcheck (errors only)
        run: |
          find deploy clients -name '*.sh' -type f -print0 \
            | xargs -0 shellcheck --severity=error

  license-gate:
    name: License gate and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject prohibited licenses in active source
        run: bash scripts/license-gate.sh

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: archgate-sbom.cdx.json
          output-file: archgate-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: archgate-sbom
          path: archgate-sbom.cdx.json
